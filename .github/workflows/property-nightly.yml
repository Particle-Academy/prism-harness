name: Property tests (long set)

# The long run of the approval pairing property tests (G-392 QC), the same
# shape as prism-harness-ts. The fast, fixed-seed set runs in Tests on every
# push and pull request; this runs only the property file, with many more
# examples and a seed taken from the run, so each run explores new cases and
# logs the seed to replay them (PRISM_PROPERTY_SEED=<seed>).
#
# `schedule` fires only from the default branch. The matrix names main only:
# a release line that does not carry the property file would fail here for
# that reason alone, so a line is added once it carries the file.
#
# Actions are pinned to full commit SHAs: actions/checkout v4.2.2 (the pin
# used elsewhere in this estate) and shivammathur/setup-php 2.40.0 (the
# commit its v2 and 2.40.0 tags both dereference to, read with
# `gh api repos/shivammathur/setup-php/git/ref/tags/<tag>` and then
# `git/tags/<sha>` for the annotated tag).

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      examples:
        description: Examples per property (a whole number from 1 to 100000)
        required: false
        default: '2000'

permissions:
  contents: read

jobs:
  property:
    name: property / ${{ matrix.ref }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ref: [main]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      # A dispatch passes its input as given, even empty: an invalid value
      # fails here, never falls back to a default. A schedule has no input.
      - name: Validate the example count
        id: examples
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          GIVEN: ${{ inputs.examples }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then value="$GIVEN"; else value=2000; fi
          count="$(sh tools/property-examples.sh "$value")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, fileinfo
          coverage: none
      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Property tests
        shell: bash
        env:
          PRISM_PROPERTY_EXAMPLES: ${{ steps.examples.outputs.count }}
          PRISM_PROPERTY_BASE_SEED: ${{ github.run_id }}
        run: |
          echo "PRISM_PROPERTY_BASE_SEED=$PRISM_PROPERTY_BASE_SEED PRISM_PROPERTY_EXAMPLES=$PRISM_PROPERTY_EXAMPLES"
          vendor/bin/pest tests/ApprovalPairingPropertyTest.php
