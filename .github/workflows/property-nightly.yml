name: Property tests (long set)

# The long run of the approval pairing property tests (G-392 QC), the same
# shape as prism-harness-ts. The fast, fixed-seed set runs in Tests on every
# push and pull request; this runs only the property file, with many more
# examples and a seed taken from the run, so each run explores new cases and
# logs the seed to replay them (PRISM_PROPERTY_SEED=<seed>).
#
# `schedule` fires only from the default branch. A dispatch may name a `ref`
# (G-387 round 16): the default branch (the default) or a release line,
# `release/<line>`, so this one main-hosted job checks the release lines too.
# tools/property-ref.sh refuses anything else (another branch, a tag, a SHA,
# `refs/...`), with no fallback. It runs from this run's own checkout before
# the named branch is checked out beside it, into `target`, and only a
# branch of THIS repository is ever checked out there.
#
# Actions are pinned to full commit SHAs: actions/checkout v4.2.2 (the pin
# used elsewhere in this estate) and shivammathur/setup-php 2.40.0 (the
# commit its v2 and 2.40.0 tags both dereference to, read with
# `gh api repos/shivammathur/setup-php/git/ref/tags/<tag>` and then
# `git/tags/<sha>` for the annotated tag).

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      examples:
        description: Examples per property (a whole number from 1 to 100000)
        required: false
        default: '2000'
      ref:
        description: Branch to test (the default branch, or release/<line>)
        required: false
        default: main

permissions:
  contents: read

jobs:
  property:
    name: property / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # A dispatch passes its input as given, even empty: an invalid value
      # fails here, never falls back to a default. A schedule has no input.
      - name: Validate the example count
        id: examples
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          GIVEN: ${{ inputs.examples }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then value="$GIVEN"; else value=2000; fi
          count="$(sh tools/property-examples.sh "$value")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Validate the branch to test
        id: ref
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          GIVEN: ${{ inputs.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then value="$GIVEN"; else value="$DEFAULT_BRANCH"; fi
          ref="$(sh tools/property-ref.sh "$value" "$DEFAULT_BRANCH")"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      # The validated branch of THIS repository, beside this run's checkout.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: refs/heads/${{ steps.ref.outputs.ref }}
          path: target
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, fileinfo
          coverage: none
      - name: Install dependencies
        working-directory: target
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Property tests
        working-directory: target
        shell: bash
        env:
          PRISM_PROPERTY_EXAMPLES: ${{ steps.examples.outputs.count }}
          PRISM_PROPERTY_BASE_SEED: ${{ github.run_id }}
          TESTED_REF: ${{ steps.ref.outputs.ref }}
        run: |
          echo "ref=$TESTED_REF PRISM_PROPERTY_BASE_SEED=$PRISM_PROPERTY_BASE_SEED PRISM_PROPERTY_EXAMPLES=$PRISM_PROPERTY_EXAMPLES"
          vendor/bin/pest tests/ApprovalPairingPropertyTest.php
