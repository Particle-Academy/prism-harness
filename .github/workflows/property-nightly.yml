name: Property tests (nightly)

# The approval-pairing and step-budget property tests
# (tests/ApprovalPairingPropertyTest.php, tests/StepBudgetPropertyTest.php)
# with a LARGE example count. The normal Tests workflow runs a small fixed-seed
# set on every push; this runs thousands of examples from a base seed taken
# from the run, printed in the log, so a failure can be replayed with
# PRISM_PROPERTY_BASE_SEED (or one example with PRISM_PROPERTY_SEED).
#
# A `schedule` only fires from the default branch, so on this release line
# the nightly does not run by itself: dispatch it by hand.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      examples:
        description: Number of generated examples
        default: "5000"

permissions:
  contents: read

jobs:
  third-party:
    name: Third-party dependency allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # This job only reads files, so it keeps no token in .git/config for
      # the fetched checker to find.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Every direct dependency must be approved on the org allowlist and still
      # maintained. The list is fetched, never vendored, so there is no copy here
      # to drift. This has to pass BEFORE a tag is pushed: Packagist publishes a
      # Composer package the moment its tag exists, so the release guard, which
      # requires this workflow to have succeeded, can only withhold the GitHub
      # release. It cannot withdraw a version.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Particle-Academy/.github
          ref: cb221e7936f8a01f2ab047a6488b253bc435d7f9
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins. It runs from the
        # workspace with nothing preloaded, so neither the job's working-directory
        # nor a variable an earlier step left behind decides what it reads or runs.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          BASH_ENV: ''
          ENV: ''
          SHELLOPTS: ''
          BASHOPTS: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: cb221e7936f8a01f2ab047a6488b253bc435d7f9
          PIN_SHA256: |
            b6ce9746345825e37beb9655e1b124c706cf5451e960b7ee3e548fa3a086f706  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            720d6d7393e943c599dab248511b8e89f29d51993c31cfaf7bda9292638b74e3  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

  property:
    name: Approval pairing properties
    runs-on: ubuntu-latest
    needs: [third-party]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Audit dependencies for known advisories
        run: composer audit --no-interaction

      - name: Run the property tests
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          # Read as given, never defaulted here: a dispatch's input must be a
          # whole number of at least 1, and the test refuses anything else
          # too. A schedule has no inputs and runs 5000.
          EXAMPLES_INPUT: ${{ inputs.examples }}
          PRISM_PROPERTY_BASE_SEED: ${{ github.run_id }}
        run: |
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            examples="${EXAMPLES_INPUT}"
          else
            examples=5000
          fi
          if ! [[ "${examples}" =~ ^[1-9][0-9]{0,6}$ ]]; then
            echo "::error::examples must be a whole number of at least 1, got '${examples}'"
            exit 1
          fi
          export PRISM_PROPERTY_EXAMPLES="${examples}"
          echo "base seed ${PRISM_PROPERTY_BASE_SEED}, ${PRISM_PROPERTY_EXAMPLES} examples"
          vendor/bin/pest tests/ApprovalPairingPropertyTest.php tests/StepBudgetPropertyTest.php
